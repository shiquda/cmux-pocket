<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">cmux Pocket connection architecture</title>
  <desc id="desc">The Android app connects over a secure WebSocket to a user-managed TLS boundary, which forwards to the loopback-only Gateway and then to cmux on macOS.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e1d24"/>
      <stop offset="1" stop-color="#2a2832"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#69b7ff"/>
    </marker>
  </defs>
  <rect width="1000" height="300" rx="24" fill="#111015"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <rect x="35" y="88" width="205" height="116" rx="18" fill="url(#panel)" stroke="#69b7ff" stroke-width="2"/>
    <text x="137" y="132" fill="#fff" font-size="24" font-weight="700">Android app</text>
    <text x="137" y="164" fill="#b9b5c2" font-size="16">cmux Pocket</text>

    <rect x="315" y="88" width="205" height="116" rx="18" fill="url(#panel)" stroke="#69b7ff" stroke-width="2"/>
    <text x="417" y="125" fill="#fff" font-size="21" font-weight="700">TLS boundary</text>
    <text x="417" y="156" fill="#b9b5c2" font-size="16">proxy / tunnel / VPN</text>
    <text x="417" y="181" fill="#b9b5c2" font-size="15">user-managed</text>

    <rect x="595" y="88" width="170" height="116" rx="18" fill="url(#panel)" stroke="#69b7ff" stroke-width="2"/>
    <text x="680" y="128" fill="#fff" font-size="22" font-weight="700">Gateway</text>
    <text x="680" y="158" fill="#b9b5c2" font-size="15">loopback-only</text>
    <text x="680" y="182" fill="#b9b5c2" font-size="15">127.0.0.1:8088</text>

    <rect x="840" y="88" width="125" height="116" rx="18" fill="url(#panel)" stroke="#69b7ff" stroke-width="2"/>
    <text x="902" y="132" fill="#fff" font-size="20" font-weight="700">cmux</text>
    <text x="902" y="162" fill="#b9b5c2" font-size="15">on macOS</text>

    <line x1="240" y1="146" x2="315" y2="146" stroke="#69b7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="278" y="116" fill="#69b7ff" font-size="15" font-weight="600">wss://</text>
    <line x1="520" y1="146" x2="595" y2="146" stroke="#69b7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="765" y1="146" x2="840" y2="146" stroke="#69b7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="680" y="250" fill="#a7a2b0" font-size="15">authoritative terminal and workspace data path</text>
  </g>
</svg>
