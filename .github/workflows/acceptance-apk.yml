name: Acceptance APK

# Signs the PR head with the existing release-signing environment and uploads
# the APK as a build artifact. It does not create a tag or publish a Release.
# The tag-bound release workflow stays the only publisher.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/acceptance-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build a signed acceptance APK
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode the protected signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/cmux-pocket-release.keystore
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/cmux-pocket-release.keystore
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_acceptanceVersionCode: "7"
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK identity and signature
        id: verify
        working-directory: android
        env:
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          # Fingerprint of the published v0.4.1 APK. A different key must fail here.
          EXPECTED_CERT_SHA256: c801d49f10948b465936c3155fa5ffef4fea7b2a1b0f029804bf4a7ea68282fa
        run: |
          set -euo pipefail
          CERT_TOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING_TOOL="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -f "$APK_PATH"
          "$CERT_TOOL" verify --verbose --print-certs "$APK_PATH"
          python3 - "$APK_PATH" "$CERT_TOOL" "$BADGING_TOOL" "$EXPECTED_CERT_SHA256" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import pathlib
          import re
          import subprocess
          import sys

          apk_path, cert_tool, badging_tool, expected_cert, output_path = sys.argv[1:]
          cert_output = subprocess.check_output(
              [cert_tool, "verify", "--print-certs", apk_path],
              text=True,
          )
          cert_match = re.search(
              r"Signer #1 certificate SHA-256 digest: ([0-9A-Fa-f:]+)",
              cert_output,
          )
          if cert_match is None:
              raise SystemExit("APK certificate fingerprint was not found")
          fingerprint = cert_match.group(1).replace(":", "").lower()
          if fingerprint != expected_cert.lower():
              raise SystemExit(
                  f"certificate {fingerprint} does not match the published release key"
              )

          badging = subprocess.check_output(
              [badging_tool, "dump", "badging", apk_path],
              text=True,
          )
          package_line = next(
              (line for line in badging.splitlines() if line.startswith("package:")),
              "",
          )
          package_match = re.search(
              r"name='([^']+)'.*?versionCode='([^']+)'.*?versionName='([^']+)'",
              package_line,
          )
          if package_match is None:
              raise SystemExit("APK package metadata was not found")
          package_name, version_code, version_name = package_match.groups()
          if package_name != "app.cmuxpocket":
              raise SystemExit(f"Unexpected application ID: {package_name}")
          if int(version_code) < 6:
              raise SystemExit(f"versionCode {version_code} is below the published 6")

          digest = hashlib.sha256(pathlib.Path(apk_path).read_bytes()).hexdigest()
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"certificate_fingerprint={fingerprint}\n")
              output.write(f"apk_sha256={digest}\n")
              output.write(f"version_code={version_code}\n")
              output.write(f"version_name={version_name}\n")
          print(f"applicationId={package_name}")
          print(f"versionCode={version_code}")
          print(f"versionName={version_name}")
          print(f"certificateSHA256={fingerprint}")
          print(f"apkSHA256={digest}")
          PY

      - name: Stage the APK artifact
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/acceptance-apk"
          mkdir -p "$stage"
          short=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$stage/cmux-pocket-pr52-${short}-signed.apk"
          printf '%s\n' \
            "head_sha=${HEAD_SHA}" \
            "package=app.cmuxpocket" \
            "version_code=${{ steps.verify.outputs.version_code }}" \
            "version_name=${{ steps.verify.outputs.version_name }}" \
            "certificate_sha256=${{ steps.verify.outputs.certificate_fingerprint }}" \
            "apk_sha256=${{ steps.verify.outputs.apk_sha256 }}" \
            > "$stage/acceptance-metadata.txt"

      - name: Upload the APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-apk
          path: ${{ runner.temp }}/acceptance-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/cmux-pocket-release.keystore"
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew --stop)
          fi
